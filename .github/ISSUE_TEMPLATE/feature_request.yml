name: Feature request
description: Suggest a new feature or an improvement to {{PROJECT_NAME}}.
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! The most helpful requests describe the problem you're running into, not just the feature you'd like. That helps us find the best fix, even if it ends up looking different from what you pictured.

        **Please don't include personal information** such as names, email addresses, or phone numbers. Use placeholders like "User A" instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you having?
      description: Describe what's hard, slow, or impossible to do today, and when it comes up.
      placeholder: When I need the same report every week, I have to set up all the filters again from scratch.
    validations:
      required: true

  # Replace these options with the kinds of people who use the project
  # (for example: Teachers, Leaders, Admins).
  - type: dropdown
    id: who
    attributes:
      label: Who has this problem?
      description: Select everyone this affects.
      multiple: true
      options:
        - People who use the app
        - Admins
        - Developers building on the project
        - Contributors to the project
        - Everyone
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What do you do about it now?
      description: Describe your current workaround, even if it happens outside the app. If there's no workaround, say so.
      placeholder: I keep a note with the filter settings and copy them in by hand each week.
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: How much does this affect you?
      options:
        - It stops me from doing something I need to do
        - It's a regular annoyance or takes a lot of extra time
        - It would be nice to have
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ideas for a solution
      description: If you have an idea for how the project could solve this, describe it here. Optional.
      placeholder: A "Save these filters" button, and a list of saved filters to pick from.

  - type: textarea
    id: alternatives
    attributes:
      label: Other approaches you've considered
      description: Any other solutions or tools you've tried or thought about, and why they didn't work as well.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help, such as sketches, screenshots, or examples from other apps. Please hide any names or email addresses first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the [existing issues](https://github.com/{{OWNER}}/{{REPO}}/issues) and this feature hasn't been requested yet.
          required: true
        - label: I removed any personal information (names, email addresses, phone numbers) from this request.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/{{OWNER}}/{{REPO}}/blob/main/CODE_OF_CONDUCT.md).
          required: true
